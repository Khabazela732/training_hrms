{% extends "hr/base/base.html" %}

{% block content %}
<section class="content">
    <div class="page-header">
        <h2>Export Employee Profiles</h2>
        <a href="{% url 'employees' %}" class="btn btn-secondary">
            <i class="fas fa-arrow-left"></i> Back
        </a>
    </div>

    {% if messages %}
    <div class="alerts">
        {% for message in messages %}
        <div class="alert alert-{{ message.tags }}">{{ message }}</div>
        {% endfor %}
    </div>
    {% endif %}

    <p>Click the button below to export all employee profiles as a PDF document.</p>
    <a href="{% url 'export_employee_profile' %}?format=pdf" class="btn btn-primary">
        <i class="fas fa-file-pdf"></i> Export PDF
    </a>
</section>
{% endblock %}
