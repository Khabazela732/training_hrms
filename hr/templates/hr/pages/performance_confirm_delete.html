{% extends 'hr/base/base.html' %}

{% block content %}

<section class="content">

    <div class="form-container">
        <div class="form-header">
            <h2>Delete Performance Review</h2>
        </div>

        <p>
            Are you sure you want to delete the performance review for
            <strong>
                {{ performance.employee.first_name }}
                {{ performance.employee.last_name }}
            </strong>?
        </p>

        <form method="POST">
            {% csrf_token %}

            <div class="form-actions">
                <button type="submit" class="btn btn-danger">
                    <i class="fas fa-trash"></i> Confirm Delete
                </button>

                <a href="{% url 'performance' %}" class="btn btn-secondary">
                    Cancel
                </a>
            </div>
        </form>

    </div>

</section>

{% endblock %}
