{% extends "hr/base/base.html" %}

{% block content %}

<h2>Leave Details</h2>

<table border="1">
    <tr>
        <th>Employee</th>
        <td>{{ leave.employee }}</td>
    </tr>

<tr>
    <th>Start Date</th>
    <td>{{ leave.start_date }}</td>
</tr>

<tr>
    <th>End Date</th>
    <td>{{ leave.end_date }}</td>
</tr>

<tr>
    <th>Reason</th>
    <td>{{ leave.reason }}</td>
</tr>

<tr>
    <th>Status</th>
    <td>{{ leave.status }}</td>
</tr>

</table>

<br>

<a href="{% url 'leave_update' leave.id %}">
    <button>Update</button>
</a>

<a href="{% url 'leave' %}">
    <button>Back</button>
</a>

{% endblock %}
