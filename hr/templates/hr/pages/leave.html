{% extends "hr/base/base.html" %}
{% block content %}

<section class="content">
            <table class="attendance-table">
                <thead>
                    <tr>
                        <th>Employee</th>
                        <th>Start Date</th>
                        <th>End Date</th>
                        <th>Reason</th>
                        <th>Status</th>
                    </tr>
                </thead>
                
                <tbody>
                {% for leave in leaves%}
                    <tr>
                        <td>{{leave.employee}}</td>
                        <td>{{leave.start_date}}</td>
                        <td>{{leave.end_date}}</td>
                        <td>{{leave.reason}}</td>
                    </tr>
                 {% endfor %}  
                </tbody>
            </table>
        </section>

{% endblock %}
