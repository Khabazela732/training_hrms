{% extends "hr/base/base.html" %}
{% block content %}
<section class="content">
    <h1>Welcome User</h1>

    <div class="cards">
        <div class="card" onclick="location.href='calendar.html'">Calendar</div>
        <a href="recruitment.html" class="card">Recruitment</a>
        <a href="applicants.html" class="card">Applicants</a>
        <a href="onboarding.html" class="card">Onboarding/Offboarding</a>
        <a href="achievements.html" class="card">Achievements</a>
        <a href="{% url 'employees' %}" class="card">
            Number of Employees ({{ employee_count }})
        </a>
    </div>

    <div class="dashboard-grid">

        <div class="box large">
            <h3>Departments stats</h3>
            <canvas id="salaryChart"></canvas>
        </div>

        <div class="box">
            <h3>Training Statistics</h3>
            <canvas id="revenueChart"></canvas>
        </div>

        <div class="box">
            <p class="balance">Today's Attendance</p>
            <canvas id="balanceChart"></canvas>
        </div>

        <div class="box large">
            <h3>Department Performance Ratings</h3>
            <canvas
                id="performanceDeptChart"
                data-labels='{{ dept_labels|safe }}'
                data-ratings='{{ dept_ratings|safe }}'>
            </canvas>
        </div>

    </div>
</section>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
const presentToday = {{ present_today }};
const absentToday = {{ absent_today }};
const lateToday = {{ late_today }};

document.addEventListener("DOMContentLoaded", function(){

    const balanceCtx = document.getElementById('balanceChart');

    if(balanceCtx){
        new Chart(balanceCtx.getContext('2d'), {
            type:'bar',
            data:{
                labels:['Present','Absent','Late'],
                datasets:[{
                    label:"Today's Attendance",
                    data:[presentToday, absentToday, lateToday],
                    backgroundColor:[
                        'rgba(34,197,94,0.6)',
                        'rgba(239,68,68,0.6)',
                        'rgba(245,158,11,0.6)'
                    ],
                    borderColor:[
                        'rgb(34,197,94)',
                        'rgb(239,68,68)',
                        'rgb(245,158,11)'
                    ],
                    borderWidth:2
                }]
            },
            options:{
                responsive:true,
                plugins:{ legend:{ position:'top'} },
                scales:{ y:{ beginAtZero:true } }
            }
        });
    }

});
</script>

{% endblock %}
