{% extends "hr/base/base.html" %}
{% block content %}

<div class="payroll-container">
    <h1>Edit Payroll</h1>

    <form method="POST" action="">
        {% csrf_token %}

        <select name="employee" required>
            {% for employee in employees %}
                <option value="{{ employee.id }}" {% if employee.id == payroll.employee.id %}selected{% endif %}>
                    {{ employee.first_name }} {{ employee.last_name }}
                </option>
            {% endfor %}
        </select>

        <input type="number" name="basic_salary" placeholder="Basic Salary" value="{{ payroll.basic_salary }}" required>
        <input type="number" name="bonus" placeholder="Bonus" value="{{ payroll.bonus }}">
        <input type="number" name="deductions" placeholder="Deductions" value="{{ payroll.deductions }}">
        <input type="text" name="month" placeholder="Month" value="{{ payroll.month }}" required>

        <button type="submit">Update Payroll</button>
    </form>
</div>

{% endblock %}
