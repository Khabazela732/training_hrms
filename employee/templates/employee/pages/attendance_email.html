<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Attendance Confirmation</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f5f7fb;
    padding:20px;
}

.email-container{
    max-width:600px;
    margin:auto;
    background:white;
    border-radius:8px;
    padding:25px;
    border:1px solid #e6e6e6;
}

.header{
    text-align:center;
    margin-bottom:20px;
}

.header h2{
    color:#0b2c5f;
}

.info-box{
    background:#f1f4fa;
    padding:15px;
    border-radius:6px;
    margin-top:15px;
}

.footer{
    margin-top:25px;
    font-size:13px;
    color:#777;
}

</style>
</head>

<body>

<div class="email-container">

<div class="header">
<h2>Attendance Confirmation</h2>
</div>

<p>Hello <strong>{{ employee.first_name }} {{ employee.last_name }}</strong>,</p>

<p>You have successfully signed your attendance.</p>

<div class="info-box">

<p><strong>Date:</strong> {{ date }}</p>

<p><strong>Check In Time:</strong> {{ check_in_time }}</p>

</div>

<p>Thank you for using the HR Management System.</p>

<div class="footer">
<p>This is an automated notification.</p>
</div>

</div>

</body>
</html>
