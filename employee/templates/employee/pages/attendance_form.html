{% extends 'employee/base/base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}

<div class="table-container">

    <div class="table-header">
        <h3>{{ title }}</h3>
    </div>

    <form method="post">
        {% csrf_token %}

        <table class="attendance-table form-table" style="width:100%; border-collapse: collapse;">
            <tbody>

                <tr>
                    <td style="padding:10px; border-bottom:1px solid #707275; font-weight:600;">
                        Status
                    </td>
                    <td style="padding:10px; border-bottom:1px solid #8f9296;">
                        <select name="status" required
                                style="padding:6px; border-radius:6px; width:100%;">
                            <option value="present">Present</option>
                            <option value="absent">Absent</option>
                            <option value="late">Late</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td style="padding:10px; border-bottom:1px solid #707275; font-weight:600;">
                        Check In Time
                    </td>
                    <td style="padding:10px; border-bottom:1px solid #8f9296;">
                        <input type="time" name="check_in_time"
                               style="padding:6px; border-radius:6px; width:100%;">
                    </td>
                </tr>

                <tr>
                    <td style="padding:10px; border-bottom:1px solid #707275; font-weight:600;">
                        Check Out Time
                    </td>
                    <td style="padding:10px; border-bottom:1px solid #8f9296;">
                        <input type="time" name="check_out_time"
                               style="padding:6px; border-radius:6px; width:100%;">
                    </td>
                </tr>

            </tbody>
        </table>

        <div class="form-actions" style="margin-top:20px;">
            <button type="submit" class="btn btn-primary"
                    style="padding:10px 25px; border-radius:6px;">
                Save
            </button>

            <a href="{% url 'employee_attendance' %}"
               class="btn btn-secondary"
               style="padding:10px 25px; border-radius:6px; margin-left:10px;">
                Cancel
            </a>
        </div>

    </form>

</div>

{% endblock %}
